[workspace]
resolver = "3"
members = [
  "crates/ghost-shell-applications/ghost-shell-cli",
  "crates/ghost-shell-core/ghost-shell-assets",
  "crates/ghost-shell-core/ghost-shell-config",
  "crates/ghost-shell-core/ghost-shell-theme",
  "crates/ghost-shell-applications/ghost-shell-bar",
  "crates/ghost-shell-applications/ghost-shell-finder",
  "crates/ghost-shell-applications/ghost-shell-launcher",
  "crates/ghost-shell-applications/ghost-shell-lockscreen",
  "crates/ghost-shell-applications/ghost-shell-greeter",
  "crates/ghost-shell-components/ghost-shell-wallpaper",
  "crates/ghost-shell-adapters/ghost-shell-audio",
  "crates/ghost-shell-adapters/ghost-shell-dbus",
  "crates/ghost-shell-adapters/ghost-shell-ipc",
  "crates/ghost-shell-adapters/ghost-shell-niri",
  "crates/ghost-shell-adapters/ghost-shell-system",
  "crates/ghost-shell-adapters/ghost-shell-greetd",
  "crates/ghost-shell-widgets/ghost-shell-widget-audio",
  "crates/ghost-shell-widgets/ghost-shell-widget-clock",
  "crates/ghost-shell-widgets/ghost-shell-widget-focus",
  "crates/ghost-shell-widgets/ghost-shell-widget-menu",
  "crates/ghost-shell-widgets/ghost-shell-widget-power",
  "crates/ghost-shell-widgets/ghost-shell-widget-tray",
  "crates/ghost-shell-widgets/ghost-shell-widget-workspaces",
]
default-members = [
  "crates/ghost-shell-applications/ghost-shell-bar",
  "crates/ghost-shell-applications/ghost-shell-launcher",
  "crates/ghost-shell-applications/ghost-shell-finder",
  "crates/ghost-shell-applications/ghost-shell-lockscreen",
]

[workspace.package]
license = "MIT"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
repository = "https://github.com/thatwhichisdev/ghost-shell"
publish = false

[workspace.dependencies]
directories = "6.0.0"
# core crates
ghost-shell-assets = { path = "crates/ghost-shell-core/ghost-shell-assets" }
ghost-shell-config = { path = "crates/ghost-shell-core/ghost-shell-config" }
ghost-shell-theme = { path = "crates/ghost-shell-core/ghost-shell-theme" }

# component crates
ghost-shell-wallpaper = { path = "crates/ghost-shell-components/ghost-shell-wallpaper" }

# adapter crates
ghost-shell-audio = { path = "crates/ghost-shell-adapters/ghost-shell-audio" }
ghost-shell-dbus = { path = "crates/ghost-shell-adapters/ghost-shell-dbus" }
ghost-shell-ipc = { path = "crates/ghost-shell-adapters/ghost-shell-ipc" }
ghost-shell-greetd = { path = "crates/ghost-shell-adapters/ghost-shell-greetd" }
ghost-shell-niri = { path = "crates/ghost-shell-adapters/ghost-shell-niri" }

# widget crates
ghost-shell-widget-audio = { path = "crates/ghost-shell-widgets/ghost-shell-widget-audio" }
ghost-shell-widget-clock = { path = "crates/ghost-shell-widgets/ghost-shell-widget-clock" }
ghost-shell-widget-focus = { path = "crates/ghost-shell-widgets/ghost-shell-widget-focus" }
ghost-shell-widget-menu = { path = "crates/ghost-shell-widgets/ghost-shell-widget-menu" }
ghost-shell-widget-power = { path = "crates/ghost-shell-widgets/ghost-shell-widget-power" }
ghost-shell-widget-tray = { path = "crates/ghost-shell-widgets/ghost-shell-widget-tray" }
ghost-shell-widget-workspaces = { path = "crates/ghost-shell-widgets/ghost-shell-widget-workspaces" }

# iced gui framework
iced = { version = "0.14.0", default-features = false }
iced_exwlshell = { git = "https://github.com/waycrate/exwlshelleventloop", rev = "d63ca8be6388846bdd3b2bb71fa1766fc28e5d91", default-features = false }
iced_wayland_subscriber = { git = "https://github.com/waycrate/exwlshelleventloop", rev = "d63ca8be6388846bdd3b2bb71fa1766fc28e5d91" }

# error handling
anyhow = "1.0.104"
snafu = "0.9.2"

# logging
log = "0.4.33"
env_logger = "0.11.11"

# integrations
fff-search = "0.10.1"
freedesktop-desktop-entry = "0.8.1"
freedesktop-icons = "0.4.0"
neo_frizbee = "0.11.0"
pipewire = "0.10.1"
starship-battery = "0.12.0"
zbus = { version = "5.18.0", default-features = false }

# cli
clap = "4.6.4"

# async
deadpool = { version = "0.13.1", default-features = false }
tokio = "1.53.1"
futures = "0.3.34"
futures-util = "0.3.32"

# gif
image = { version = "0.25.10", default-features = false }

# pam authentication
nonstick = "0.1.2"
greetd_ipc = { version = "0.10.3", default-features = false }

# time
jiff = "0.2.35"

# serialization/deserialization
postcard = "1.1.3"
serde = "1.0.228"
serde_json = "1.0.151"

# system information
sysinfo = "0.39.6"

# util
lz4_flex = "0.14.0"
regex = "1.13.1"
rust-embed = "8.12.0"
uuid = "1.1.2"
