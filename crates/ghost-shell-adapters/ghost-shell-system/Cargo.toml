[package]
license.workspace = true
name = "ghost-shell-system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/system.rs"

[features]
default = ["sysinfo"]
sysinfo = ["dep:sysinfo", "dep:iced"]

[dependencies]
iced.workspace = true
iced.optional = true
iced.features = ["tokio", "wayland", "wgpu"]

tokio.workspace = true
tokio.features = ["time", "rt", "sync"]

sysinfo.workspace = true
sysinfo.optional = true
sysinfo.features = ["system", "gpu"]
snafu.workspace = true
