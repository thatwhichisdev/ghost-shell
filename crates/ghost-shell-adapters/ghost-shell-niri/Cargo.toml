[package]
license.workspace = true
name = "ghost-shell-niri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/niri.rs"

[dependencies]
deadpool = { workspace = true, features = ["managed"] }
log.workspace = true
iced = { workspace = true, features = ["tokio", "wayland", "wgpu", "sipper"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "time", "sync"] }

uuid = { workspace = true, features = ["serde", "v5"] }
snafu.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt"] }
