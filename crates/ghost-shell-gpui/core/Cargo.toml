[package]
name = "ghost-shell-gpui-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lib]
path = "../src/gpui.rs"

[features]
default = []
test-support = ["leak-detection", "collections/test-support", "scheduler/test-support", "proptest"]
proptest = ["dep:proptest"]
bench-support = ["profiler", "dep:criterion"]
inspector = ["gpui_macros/inspector"]
leak-detection = ["dep:backtrace"]
profiler = ["dep:hdrhistogram"]
stacker = ["dep:stacksafe"]

[dependencies]
accesskit.workspace = true
anyhow.workspace = true
async-task.workspace = true
async-channel.workspace = true
backtrace = { workspace = true, optional = true }
bitflags.workspace = true
collections.workspace = true
criterion = { workspace = true, optional = true }
ctor.workspace = true
derive_more.workspace = true
etagere.workspace = true
futures.workspace = true
futures-concurrency.workspace = true
gpui_macros.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
inventory.workspace = true
itertools.workspace = true
log.workspace = true
num_cpus = "1.13"
parking = "2.0.0"
parking_lot.workspace = true
postage.workspace = true
proptest = { workspace = true, optional = true }
chrono.workspace = true
profiling.workspace = true
rand.workspace = true
raw-window-handle.workspace = true
regex.workspace = true
refineable.workspace = true
scheduler.workspace = true
resvg.workspace = true
usvg.workspace = true
ttf-parser = "0.25"
schemars.workspace = true
seahash = "4.1"
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
slotmap.workspace = true
smallvec.workspace = true
smol_str = "0.3.6"
stacksafe = { workspace = true, optional = true }
strum.workspace = true
sum_tree.workspace = true
thiserror.workspace = true
taffy = "=0.13.0"
gpui_util.workspace = true
hdrhistogram = { workspace = true, optional = true }
waker-fn = "1.2.0"
lyon = "1.0"
pin-project = "1.1.10"
spin = "0.10.0"
pollster.workspace = true
url.workspace = true
uuid.workspace = true
web-time.workspace = true
heapless.workspace = true

[dev-dependencies]
backtrace.workspace = true
collections = { workspace = true, features = ["test-support"] }
env_logger.workspace = true
lyon = { version = "1", features = ["extra"] }
scheduler = { workspace = true, features = ["test-support"] }
unicode-segmentation.workspace = true
proptest.workspace = true
