[package]
name = "ghost-shell-gpui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
autoexamples = false

[lib]
name = "ghost_shell_gpui"
path = "src/gpui_platform.rs"
doctest = false

[[example]]
name = "hello_shell"
path = "examples/hello_shell.rs"

[features]
default = []
test-support = ["gpui/test-support"]
bench-support = ["gpui/bench-support"]
inspector = ["gpui/inspector"]

[dependencies]
gpui = { package = "ghost-shell-gpui-core", path = "core" }
accesskit.workspace = true
accesskit_unix.workspace = true
anyhow.workspace = true
ashpd = { workspace = true, features = ["wayland"] }
bitflags.workspace = true
bytemuck = "1"
calloop = "0.14.3"
calloop-wayland-source = "0.4.1"
collections.workspace = true
filedescriptor = "0.8.2"
futures.workspace = true
gpui_util.workspace = true
gpui_wgpu = { workspace = true, features = ["font-kit"] }
libc.workspace = true
log.workspace = true
notify-rust.workspace = true
open = "5.2.0"
parking_lot.workspace = true
raw-window-handle.workspace = true
smallvec.workspace = true
smol.workspace = true
strum.workspace = true
url.workspace = true
uuid.workspace = true
wayland-backend = { version = "0.3.15", features = ["client_system", "dlopen", "log"] }
wayland-client = "0.31.11"
wayland-cursor = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client", "staging", "unstable"] }
wayland-protocols-plasma = { version = "0.3.9", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.9", features = ["client"] }
xkbcommon = { version = "0.8.0", default-features = false, features = ["wayland"] }

[dev-dependencies]
gpui = { package = "ghost-shell-gpui-core", path = "core", features = ["test-support"] }
