[package]
name = "ghost-shell-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.cargo-shear]
ignored = [
  "bindgen",
  "font-kit",
  "getrandom",
  "objc2",
  "objc2-metal",
]
ignored-paths = ["src/_ownership_and_data_flow.rs"]

[lib]
path = "src/gpui.rs"

[[example]]
name = "hello_world"
path = "examples/hello_world.rs"

[[example]]
name = "move_entity_between_windows"
path = "examples/move_entity_between_windows.rs"

[[example]]
name = "image"
path = "examples/image/image.rs"

[[example]]
name = "input"
path = "examples/input.rs"

[[example]]
name = "on_window_close_quit"
path = "examples/on_window_close_quit.rs"

[[example]]
name = "window_movable"
path = "examples/window_movable.rs"

[[example]]
name = "opacity"
path = "examples/opacity.rs"

[[example]]
name = "pattern"
path = "examples/pattern.rs"

[[example]]
name = "set_menus"
path = "examples/set_menus.rs"

[[example]]
name = "system_notifications"
path = "examples/system_notifications.rs"

[[example]]
name = "shadow"
path = "examples/shadow.rs"

[[example]]
name = "svg"
path = "examples/svg/svg.rs"

[[example]]
name = "tab_stop"
path = "examples/tab_stop.rs"

[[example]]
name = "text"
path = "examples/text.rs"

[[example]]
name = "text_wrapper"
path = "examples/text_wrapper.rs"

[[example]]
name = "tree"
path = "examples/tree.rs"

[[example]]
name = "uniform_list"
path = "examples/uniform_list.rs"

[[example]]
name = "window_shadow"
path = "examples/window_shadow.rs"

[[example]]
name = "grid_layout"
path = "examples/grid_layout.rs"

[[example]]
name = "list_example"
path = "examples/list_example.rs"

[[example]]
name = "mouse_pressure"
path = "examples/mouse_pressure.rs"

[[example]]
name = "a11y"
path = "examples/a11y.rs"

[[example]]
name = "view_example"
path = "examples/view_example/view_example_main.rs"

[dependencies]
accesskit.workspace = true
anyhow.workspace = true
async-task.workspace = true
backtrace = { workspace = true, optional = true }
bitflags.workspace = true

chrono.workspace = true
collections.workspace = true
criterion = { workspace = true, optional = true }
ctor.workspace = true
derive_more.workspace = true
etagere.workspace = true
futures.workspace = true
futures-concurrency.workspace = true
gpui_macros.workspace = true
gpui_shared_string.workspace = true
gpui_util.workspace = true
hdrhistogram = { workspace = true, optional = true }
heapless.workspace = true
http_client.workspace = true
image.workspace = true
inventory.workspace = true
itertools.workspace = true
log.workspace = true
lyon = "1.0"
num_cpus = "1.13"
parking = "2.0.0"
parking_lot.workspace = true
pin-project = "1.1.10"
pollster.workspace = true
postage.workspace = true
profiling.workspace = true
proptest = { workspace = true, optional = true }
rand.workspace = true
raw-window-handle.workspace = true
refineable.workspace = true
regex.workspace = true
resvg.workspace = true
scheduler.workspace = true
schemars.workspace = true
seahash = "4.1"
serde.workspace = true
serde_json.workspace = true
slotmap.workspace = true
smallvec.workspace = true
spin = "0.10.0"
stacksafe = { workspace = true, optional = true }
strum.workspace = true
sum_tree.workspace = true
taffy = "=0.13.0"
thiserror.workspace = true
ttf-parser = "0.25"
url.workspace = true
usvg.workspace = true
util_macros.workspace = true
uuid.workspace = true
waker-fn = "1.2.0"
web-time.workspace = true

[dev-dependencies]
backtrace.workspace = true
collections = { workspace = true, features = ["test-support"] }
env_logger.workspace = true
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
gpui_util = { workspace = true }
lyon = { version = "1.0", features = ["extra"] }
rand.workspace = true
scheduler = { workspace = true, features = ["test-support"] }
unicode-segmentation = { workspace = true }

[build-dependencies]
embed-resource = { version = "3.0", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Workspace inheritance would re-enable defaults, including blocking channel synchronization.
async-channel = { version = "2.5.0", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "windows"))'.dependencies]
scap = { workspace = true, optional = true }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
async-channel.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
http_client = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
reqwest_client = { workspace = true, features = ["test-support"] }

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen = { workspace = true }
web-sys = { version = "0.3", features = ["console"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-video.workspace = true
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = {
  package = "zed-font-kit",
  git = "https://github.com/zed-industries/font-kit",
  rev = "94b0f28166665e8fd2f53ff6d268a14955c82269",
  version = "0.14.1-zed",
  optional = true
}
log.workspace = true
objc2 = { workspace = true, optional = true }
objc2-core-foundation.workspace = true
objc2-core-video.workspace = true
objc2-metal = { version = "0.3", optional = true }

[target.'cfg(target_os = "macos")'.build-dependencies]
bindgen = "0.72"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Power"] }

[features]
default = ["font-kit", "wayland", "windows-manifest", "x11"]
# Preserve the published feature name while consumers migrate to `bench-support`.
bench = ["bench-support"]
bench-support = ["dep:criterion", "profiler"]
inspector = ["gpui_macros/inspector"]
leak-detection = ["backtrace"]
profiler = ["dep:hdrhistogram"]
screen-capture = [
  "scap",
]
stacker = ["dep:stacksafe"]
test-support = [
  "collections/test-support",
  "http_client/test-support",
  "leak-detection",
  "proptest",
  "wayland",
  "x11",
]
wayland = []
windows-manifest = ["dep:embed-resource"]
x11 = [
  "scap?/x11",
]

[lints]
workspace = true
