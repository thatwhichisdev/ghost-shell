[package]
name = "ghost-shell-gpui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
autoexamples = false

[lib]
name = "ghost_shell_gpui"
path = "src/gpui.rs"
doctest = false

[[example]]
name = "hello_shell"
path = "examples/hello_shell.rs"

[features]
default = ["font-kit"]
font-kit = ["dep:font-kit"]
test-support = ["leak-detection", "proptest"]
proptest = ["dep:proptest"]
bench-support = ["profiler", "dep:criterion"]
inspector = ["ghost-shell-gpui-macros/inspector"]
leak-detection = []
profiler = ["dep:hdrhistogram"]
stacker = ["dep:stacksafe"]

[dependencies]
accesskit.workspace = true
accesskit_unix.workspace = true
anyhow.workspace = true
ashpd = { workspace = true, features = ["wayland"] }
async-channel.workspace = true
async-task.workspace = true
backtrace.workspace = true
bitflags.workspace = true
bytemuck = "1"
calloop = "0.14.3"
calloop-wayland-source = "0.4.1"
chrono.workspace = true
cosmic-text = "0.19.0"
criterion = { workspace = true, optional = true }
ctor.workspace = true
derive_more.workspace = true
etagere.workspace = true
filedescriptor = "0.8.2"
flume.workspace = true
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", optional = true }
futures.workspace = true
futures-concurrency.workspace = true
ghost-shell-gpui-macros.workspace = true
gpui_util.workspace = true
hdrhistogram = { workspace = true, optional = true }
heapless.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
indexmap.workspace = true
inventory.workspace = true
itertools.workspace = true
libc.workspace = true
log.workspace = true
lyon = "1.0"
notify-rust.workspace = true
num_cpus = "1.13"
open = "5.2.0"
parking = "2.0.0"
parking_lot.workspace = true
pin-project = "1.1.10"
pollster.workspace = true
postage.workspace = true
profiling.workspace = true
proptest = { workspace = true, optional = true }
rand.workspace = true
raw-window-handle.workspace = true
rayon.workspace = true
regex.workspace = true
resvg.workspace = true
rustc-hash.workspace = true
schemars.workspace = true
seahash = "4.1"
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
slotmap.workspace = true
smallvec.workspace = true
smol.workspace = true
smol_str = "0.3.6"
spin = "0.10.0"
stacksafe = { workspace = true, optional = true }
strum.workspace = true
swash.workspace = true
taffy = "=0.13.0"
thiserror.workspace = true
tracing.workspace = true
ttf-parser = "0.25"
unicode-bidi.workspace = true
unicode-segmentation.workspace = true
url.workspace = true
usvg.workspace = true
uuid.workspace = true
waker-fn = "1.2.0"
wayland-backend = { version = "0.3.15", features = ["client_system", "dlopen", "log"] }
wayland-client = "0.31.11"
wayland-cursor = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client", "staging", "unstable"] }
wayland-protocols-plasma = { version = "0.3.9", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.9", features = ["client"] }
web-time.workspace = true
wgpu.workspace = true
xkbcommon = { version = "0.8.0", default-features = false, features = ["wayland"] }

[dev-dependencies]
backtrace.workspace = true
env_logger.workspace = true
lyon = { version = "1", features = ["extra"] }
naga = { version = "29.0.4", features = ["wgsl-in"] }
proptest.workspace = true
unicode-segmentation.workspace = true
